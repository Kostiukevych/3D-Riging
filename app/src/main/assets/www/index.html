<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>Mesh2Motion Offline Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1017;
      --surface: #161b26;
      --border: #2d374b;
      --accent: #22d3ee;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #162438 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .card {
      width: 100%;
      max-width: 640px;
      margin: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip {
      background: #1f2737;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    button, label.btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: var(--accent); color: #082f49; }
    .btn-secondary { background: #1f2737; color: var(--text); border: 1px solid var(--border); }
    input[type="file"] { display: none; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 12px; }
    #log { margin-top: 12px; font-size: 13px; color: var(--accent); min-height: 18px; }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <button class="btn-secondary" type="button">Explore</button>
      <button class="btn-secondary" type="button">Use Your Model</button>
      <button class="btn-secondary" type="button">Use Your Rigged Model</button>
      <button class="btn-secondary" type="button">Settings</button>
    </div>
  </header>

  <main class="card">
    <span class="badge">Offline WebViewAssetLoader</span>
    <h1>Mesh2Motion</h1>
    <p>No model loaded</p>

    <div class="chips">
      <span class="chip">Human</span>
      <span class="chip">Fox</span>
      <span class="chip">Bird</span>
      <span class="chip">Dragon</span>
    </div>

    <div class="actions">
      <label class="btn btn-primary" for="modelInput">Choose Model</label>
      <input id="modelInput" type="file" accept=".glb,.gltf,.fbx,.obj,.dae,.zip" />
      <button class="btn-secondary" id="exportTestBtn" type="button">Export GLB</button>
      <button class="btn-secondary" type="button">Cancel</button>
    </div>

    <div class="hint">Rotate / Pan / Zoom</div>
    <div id="log"></div>
  </main>

  <script type="module">
    const logEl = document.getElementById('log');
    document.getElementById('modelInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      logEl.textContent = file
        ? `${file.name} (${file.size} bytes)`
        : 'Cancel';
    });

    document.getElementById('exportTestBtn').addEventListener('click', () => {
      const sample = new Blob(['glTF-binary-offline-test'], { type: 'model/gltf-binary' });
      const url = URL.createObjectURL(sample);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mesh2motion_export.glb';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      logEl.textContent = 'Export GLB -> mesh2motion_export.glb';
    });
  </script>
</body>
</html>
