name: Build Mesh2Motion Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Offline Web Bundle & Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone, Build & Localize Offline Mesh2Motion Web Bundle
        run: |
          git clone --depth 1 https://github.com/Mesh2Motion/mesh2motion-app.git temp_web
          cd temp_web
          npm ci || npm install
          npm run build -- --base=./ || npx vite build --base=./
          cd ..
          python3 .github/scripts/localize_web_assets.py temp_web
          mkdir -p app/src/main/assets/www
          rm -rf app/src/main/assets/www/*
          cp -r temp_web/dist/* app/src/main/assets/www/
          rm -rf temp_web

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate Release & Debug Keystores
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=Mesh2Motion, OU=Mobile, O=Mesh2Motion, L=Unknown, ST=Unknown, C=US"
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Build Signed Release & Debug APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Upload Mesh2Motion Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mesh2Motion-Android-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
